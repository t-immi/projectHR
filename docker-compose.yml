services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project_hr
      POSTGRES_PASSWORD: project_hr_password
      POSTGRES_DB: project_hr_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_hr -d project_hr_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml:
    build:
      context: ./ml_service
    environment:
      ML_STUB: "false"
      MODEL_PATH: /app/resume_model_v2_epoch_3
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: project_hr
      DATABASE_PASSWORD: project_hr_password
      ML_SERVICE_URL: http://ml:8000
      ML_STUB: "false"
      HH_MOCK: "true"
      RAILS_ENV: development
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy

volumes:
  postgres_data:
  bundle_cache:
